name: Build and deploy CFA Equity Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check JavaScript syntax and required files
        run: |
          node --check app.js
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'id="app"' index.html
          grep -q 'function renderDashboard' app.js
          grep -q 'function renderPractice' app.js
          grep -q 'function renderQuestionBuilder' app.js
      - name: Install UI smoke-test dependency
        run: npm install --no-save --no-package-lock jsdom@26 eslint@9 globals@16
      - name: Lint browser JavaScript for undefined identifiers
        run: npx eslint app.js --config .github/scripts/eslint.config.cjs
      - name: Test interactive UI flows
        run: node .github/scripts/ui-smoke-test.cjs
      - name: Prepare static website artifact
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
